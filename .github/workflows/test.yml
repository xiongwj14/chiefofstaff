name: Test
# Every pull request must pass all of these before it can be merged (see the "CI passed" job,
# the one required check). Actions are pinned to commits; Dependabot proposes updates.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --locked --extra dev ruff check --output-format=github .
      - name: Formatting
        run: uv run --locked --extra dev ruff format --check --diff .
      - name: Pyright
        run: uv run --locked --extra dev pyright
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: ESLint (web UI)
        run: npx --yes eslint@10.14.0 --max-warnings 0 src/chiefofstaff/static
      - name: Workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13') }}
        run: uv run --locked --extra dev pytest -q --timeout 120
      - name: Tests with coverage (at least 88% of lines and branches)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: >-
          uv run --locked --extra dev pytest -q --timeout 120
          --cov=chiefofstaff --cov-branch --cov-report=term-missing:skip-covered
          --cov-fail-under=88

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv build
      - name: Metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: The wheel installs and starts, with its web UI
        run: |
          uv venv /tmp/installed
          uv pip install --python /tmp/installed dist/*.whl
          /tmp/installed/bin/chiefofstaff --help
          /tmp/installed/bin/python - <<'PY'
          from importlib.resources import files
          static = files("chiefofstaff") / "static"
          for name in ("index.html", "app.js", "style.css"):
              assert (static / name).is_file(), name
          PY

  demo-ui:
    # The whole product in a browser, with scripted sessions: no Copilot or Slack account.
    name: Demo in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run --with playwright python -m playwright install --with-deps chromium
      - run: uv run --with playwright python scripts/demo_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: demo-screenshots
          path: browser-shots/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate

  passed:
    # The one check branch protection requires: it fails unless every job above passed (or,
    # for dependency review, did not apply).
    name: CI passed
    if: always()
    needs: [lint, test, package, demo-ui, secrets, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -Eq '"(failure|cancelled)"' && exit 1 || exit 0
