name: Copilot integration
# The contract tests against the real GitHub Copilot CLI. They need a token with Copilot access
# (a fine-grained personal access token with the "Copilot Requests" permission) stored as the
# COPILOT_GITHUB_TOKEN secret; without it the job is skipped.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Skip without a Copilot token
        id: token
        run: echo "present=${{ secrets.COPILOT_GITHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.13"
      - if: steps.token.outputs.present == 'true'
        run: npm install -g @github/copilot
      - if: steps.token.outputs.present == 'true'
        run: uv sync --locked --extra dev
      - if: steps.token.outputs.present == 'true'
        run: uv run --extra dev pytest -q -m copilot tests/test_backend_contract.py
        env:
          CHIEFOFSTAFF_TEST_COPILOT: "1"
